services:
  - type: web
    name: skinlab
    runtime: node
    plan: free
    region: singapore
    buildCommand: "npm install --include=dev && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "10000"
